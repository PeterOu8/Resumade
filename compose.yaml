name: resumade

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
  ConnectionStrings__ResumadeDatabase: Host=database;Port=5432;Database=resumade;Username=resumade;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
  Jwt__Issuer: Resumade
  Jwt__Audience: ResumadeUsers
  Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
  Proxy__WebToken: ${RESUMADE_PROXY_TOKEN:-}
  Resend__ApiKey: ${RESEND_API_KEY:-}
  Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
  Frontend__BaseUrl: ${WEB_ORIGIN:-http://localhost:3000}
  Google__ClientId: ${AUTH_GOOGLE_ID:-}

services:
  database:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: resumade
      POSTGRES_USER: resumade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - resumade-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumade -d resumade"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 200

  migrate:
    build:
      context: ./api
      target: runtime
    command: ["/app/migrate"]
    entrypoint: []
    environment: *api-environment
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100

  api:
    build:
      context: ./api
      target: runtime
    environment: *api-environment
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-5011}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 200

  web:
    build:
      context: ./web
      target: runtime
    environment:
      API_URL: http://api:8080
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      RESUMADE_PROXY_TOKEN: ${RESUMADE_PROXY_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 200

volumes:
  resumade-postgres-data:

networks:
  edge:
  backend:
    internal: true
