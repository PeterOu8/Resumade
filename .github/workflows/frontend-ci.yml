name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/**'
      - '.gitignore'
      - '.npmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Keep the PR check present for branch protection, even when work is skipped.
      - name: Check PR paths
        id: scope
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD -- web .github .gitignore .npmrc)
          if [[ -z "$changed" ]]; then
            echo 'No frontend or shared CI changes.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.skip != 'true'
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.skip != 'true'
        run: npm run lint

      - name: Type check
        if: steps.scope.outputs.skip != 'true'
        run: |
          npm exec -- next typegen
          npm exec -- tsc --noEmit

      - name: Build for production
        if: steps.scope.outputs.skip != 'true'
        run: npm run build
