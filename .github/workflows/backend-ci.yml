name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: resumade_test
          POSTGRES_PASSWORD: resumade-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d resumade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # HEAD is GitHub's PR merge commit and its first parent is the base commit.
      - name: Check PR paths
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD -- \
            api tests Resumade.Api.slnx .github .gitignore \
            'Directory.Build.*' Directory.Packages.props global.json ':(icase)nuget.config')
          if [[ -z "$changed" ]]; then
            echo 'No backend or shared CI changes.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            api/packages.lock.json
            tests/Resumade.Api.Tests/packages.lock.json

      - name: Restore dependencies
        if: steps.scope.outputs.skip != 'true'
        run: dotnet restore Resumade.Api.slnx --locked-mode

      - name: Build in Release
        if: steps.scope.outputs.skip != 'true'
        run: dotnet build Resumade.Api.slnx --configuration Release --no-restore

      - name: Run tests in Release
        id: tests
        if: steps.scope.outputs.skip != 'true'
        env:
          # The default test host needs these settings at startup.
          Jwt__Key: resumade-ci-signing-key-for-tests-only
          ConnectionStrings__ResumadeDatabase: Host=127.0.0.1;Database=unused
          RESUMADE_AUTH_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=resumade_test;Username=postgres;Password=resumade-test-only
        run: |
          dotnet test Resumade.Api.slnx --configuration Release --no-build \
            --results-directory TestResults --logger 'trx;LogFileName=backend-tests.trx'

      - name: Upload test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: TestResults/*.trx
          retention-days: 7

  publish-image:
    name: Publish backend image
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test the container
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/resumade-api:${{ github.sha }}
        run: |
          image="${IMAGE,,}"
          if ! docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" api > "$RUNNER_TEMP/resumade-build.log" 2>&1; then
            cat "$RUNNER_TEMP/resumade-build.log"
            build_error=$(grep -E 'ERROR:|failed to solve' "$RUNNER_TEMP/resumade-build.log" | tail -1 || true)
            echo "::error::Container build failed. $build_error"
            exit 1
          fi
          container=$(docker run --detach --publish 127.0.0.1:18080:8080 \
            --env Jwt__Key=container-smoke-test-key-at-least-32-characters \
            --env 'ConnectionStrings__ResumadeDatabase=Host=localhost;Database=unused' "$image")
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 4 http://127.0.0.1:18080/api/health; then
            echo "::error::The container did not pass its HTTP health check."
            exit 1
          fi

      - name: Push the commit-tagged image to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/resumade-api:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE,,}"

  migrate-database:
    name: Migrate production database
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/database-migrations.yml
    secrets:
      NEON_MIGRATION_CONNECTION: ${{ secrets.NEON_MIGRATION_CONNECTION }}

  deploy:
    name: Deploy backend to Azure
    needs: migrate-database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Azure Container App image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/resumade-api:${{ github.sha }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          image="${IMAGE,,}"
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --image "$image" \
            --output none
          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --query properties.latestReadyRevisionName \
            --output tsv
