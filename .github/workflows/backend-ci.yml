name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'tests/**'
      - 'Resumade.Api.slnx'
      - '.github/**'
      - '.gitignore'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '[Nn]u[Gg]et.[Cc]onfig'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: resumade_test
          POSTGRES_PASSWORD: resumade-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d resumade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # HEAD is GitHub's PR merge commit and its first parent is the base commit.
      - name: Check PR paths
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD -- \
            api tests Resumade.Api.slnx .github .gitignore \
            'Directory.Build.*' Directory.Packages.props global.json ':(icase)nuget.config')
          if [[ -z "$changed" ]]; then
            echo 'No backend or shared CI changes.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            api/packages.lock.json
            tests/Resumade.Api.Tests/packages.lock.json

      - name: Restore dependencies
        if: steps.scope.outputs.skip != 'true'
        run: dotnet restore Resumade.Api.slnx --locked-mode

      - name: Build in Release
        if: steps.scope.outputs.skip != 'true'
        run: dotnet build Resumade.Api.slnx --configuration Release --no-restore

      - name: Run tests in Release
        id: tests
        if: steps.scope.outputs.skip != 'true'
        env:
          # The default test host needs these settings at startup.
          Jwt__Key: resumade-ci-signing-key-for-tests-only
          ConnectionStrings__ResumadeDatabase: Host=127.0.0.1;Database=unused
          RESUMADE_AUTH_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=resumade_test;Username=postgres;Password=resumade-test-only
        run: |
          # Use the runner image's system Chrome with sandboxing enabled.
          PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)
          export PUPPETEER_EXECUTABLE_PATH
          "$PUPPETEER_EXECUTABLE_PATH" --version
          dotnet test Resumade.Api.slnx --configuration Release --no-build \
            --results-directory TestResults --logger 'trx;LogFileName=backend-tests.trx'

      - name: Upload test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: TestResults/*.trx
          retention-days: 7

  publish-image:
    name: Publish backend image
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test the container
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/resumade-api:${{ github.sha }}
        run: |
          image="${IMAGE,,}"
          if ! docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" api > "$RUNNER_TEMP/resumade-build.log" 2>&1; then
            cat "$RUNNER_TEMP/resumade-build.log"
            build_error=$(grep -E 'ERROR:|failed to solve' "$RUNNER_TEMP/resumade-build.log" | tail -1)
            echo "::error::Container build failed. $build_error"
            exit 1
          fi
          container=$(docker run --detach --publish 127.0.0.1:18080:8080 \
            --env Jwt__Key=container-smoke-test-key-at-least-32-characters \
            --env 'ConnectionStrings__ResumadeDatabase=Host=localhost;Database=unused' "$image")
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 4 http://127.0.0.1:18080/api/health; then
            echo "::error::The container did not pass its HTTP health check."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 45 \
            --header 'Content-Type: application/json' \
            --data '{"title":"Container smoke test","html":"<h1>Container smoke test</h1>"}' \
            --output "$RUNNER_TEMP/resumade-smoke.pdf" http://127.0.0.1:18080/api/resumes/pdf ||
            [[ "$(head -c 5 "$RUNNER_TEMP/resumade-smoke.pdf")" != '%PDF-' ]]; then
            browser_error=$(docker logs "$container" 2>&1 | grep -Ei 'sandbox|failed to launch|operation not permitted' | tail -1)
            echo "::error::The container PDF smoke test failed. $browser_error"
            exit 1
          fi

      - name: Push the commit-tagged image to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/resumade-api:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE,,}"
